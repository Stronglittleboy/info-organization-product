services:
  postgres:
    image: postgres:15-alpine
    container_name: info-org-postgres
    environment:
      POSTGRES_DB: info_organization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d info_organization"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
