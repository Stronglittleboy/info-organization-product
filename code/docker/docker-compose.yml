services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:20171
        HTTPS_PROXY: http://127.0.0.1:20171
    image: info-org-postgres:15-jieba
    container_name: info-org-postgres
    # 注意：POSTGRES_* 仅在数据卷首次初始化时生效。若复用旧卷导致与 DB_PASSWORD 不一致，
    # 可在库内执行：ALTER USER postgres WITH PASSWORD 'postgres';（与下方 backend 环境变量对齐）
    environment:
      POSTGRES_DB: info_organization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d info_organization"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      network: host
      # 构建时绑定本地 Maven 仓库（读写）：默认 code/docker/maven-cache；可 MAVEN_HOST_REPO=$HOME/.m2/repository
      additional_contexts:
        maven-host: ${MAVEN_HOST_REPO:-./maven-cache}
      args:
        HTTP_PROXY: http://127.0.0.1:20171
        HTTPS_PROXY: http://127.0.0.1:20171
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres}
    container_name: info-org-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/info_organization
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:20171
        HTTPS_PROXY: http://127.0.0.1:20171
    container_name: info-org-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
