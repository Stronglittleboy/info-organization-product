services:
  postgres:
    image: postgres:15-alpine
    container_name: info-org-postgres
    environment:
      POSTGRES_DB: info_organization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d info_organization"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
